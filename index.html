<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dexcrate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e7" />
    <script>
      // Thema vóór de eerste render zetten, zodat er geen flits is. Zonder keuze licht (21-10-2026); Automatic volgt het toestel.
      try {
        var t =
          localStorage.getItem('dexcrate:theme') ||
          localStorage.getItem('binderline:theme') ||
          localStorage.getItem('kaartenmap:theme')
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <title>Dexcrate – Pokémon card collection</title>
    <!-- De app (inlogscherm) hoort niet in zoekmachines; de landingspagina op dexcrate.com wel. -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
